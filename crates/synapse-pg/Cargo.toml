[package]
name = "synapse-pg"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Postgres wire-protocol proxy → Synapse Store (async, pgwire backend)"

[dependencies]
pgwire = "0.40"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
async-trait = "0.1"
thiserror = "2"
futures = "0.3"
synapse-libsql = { path = "../synapse-libsql" }

[features]
default = []
