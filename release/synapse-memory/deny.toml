[advisories]
ignore = [
  # smallstr 0.3.1 unmaintained (informational, not a vulnerability) —
  # transitive dep of yrs 0.26 (CRDT merge); no maintained replacement exists
  # in that dependency chain. Remove when yrs drops smallstr.
  "RUSTSEC-2026-0215",
]

[licenses]
allow = [
  "FSL-1.1-ALv2",
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
