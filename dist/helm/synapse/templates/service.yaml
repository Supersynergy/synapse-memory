apiVersion: v1
kind: Service
metadata:
  name: {{ include "synapse.fullname" . }}
  labels:
    app: {{ include "synapse.name" . }}
spec:
  type: {{ .Values.service.daemon.type }}
  selector:
    app: {{ include "synapse.name" . }}
  ports:
    - name: daemon
      port: {{ .Values.service.daemon.port }}
      targetPort: {{ .Values.service.daemon.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "synapse.fullname" . }}-metrics
  labels:
    app: {{ include "synapse.name" . }}
spec:
  type: {{ .Values.service.metrics.type }}
  selector:
    app: {{ include "synapse.name" . }}
  ports:
    - name: metrics
      port: {{ .Values.service.metrics.port }}
      targetPort: {{ .Values.service.metrics.port }}
