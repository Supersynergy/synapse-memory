[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synapse-qlib"
version = "0.1.0"
description = "Synapse-X DataHandler for Microsoft Qlib"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
qlib = ["pyqlib>=0.9"]
dev = ["pytest>=8.0"]
