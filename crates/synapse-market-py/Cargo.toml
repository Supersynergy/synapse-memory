[package]
name = "synapse-market-py"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Python bindings for synapse-market via PyO3"

[lib]
name = "synapse_market_py"
crate-type = ["cdylib"]

[dependencies]
# extension-module comes from [tool.maturin].features in pyproject.toml;
# enabling it unconditionally breaks `cargo build --workspace` (no libpython link).
pyo3 = { version = "0.24", features = ["abi3-py39"] }
synapse-market = { path = "../synapse-market" }
anyhow.workspace = true
