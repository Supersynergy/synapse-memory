name: release-ctxos

# Tag-driven release of the Context-OS server binary for worldwide install.
#   git tag ctxos-v0.1.0 && git push origin ctxos-v0.1.0
# Produces sha256-verified synapse-mcp binaries that scripts/install.sh downloads.

on:
  push:
    tags: ["ctxos-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,        target: aarch64-apple-darwin }
          - { os: macos-13,        target: x86_64-apple-darwin }
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Build
        run: cargo build --release -p synapse-mcp --target ${{ matrix.target }}
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/synapse-mcp" "dist/synapse-mcp-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: synapse-mcp-${{ matrix.target }}
          path: dist/synapse-mcp-${{ matrix.target }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staged
          merge-multiple: true
      - name: Checksums
        run: |
          cd staged
          sha256sum synapse-mcp-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            staged/synapse-mcp-*
            staged/SHA256SUMS
          generate_release_notes: true
