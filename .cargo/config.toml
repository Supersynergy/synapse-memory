# Synapse workspace cargo config.
# Kept minimal — no machine-specific paths, no proprietary registries.

[build]
# Enable incremental only in dev; release is lto=thin which ignores incremental.
incremental = true

# Distributed artifacts must use Rust's portable architecture baseline. Local
# benchmark work can opt in explicitly with
# `RUSTFLAGS="-C target-cpu=native" cargo bench ...` and must label its result.

# Keep cross-target flags explicit so machine-local Cargo configuration cannot
# accidentally inject a host-only CPU target into release jobs.
[target.aarch64-unknown-linux-gnu]
rustflags = []

[target.x86_64-unknown-linux-gnu]
rustflags = []

# Static musl targets — portable single-binary distribution (Alpine, old glibc, containers).
[target.aarch64-unknown-linux-musl]
rustflags = []

[target.x86_64-unknown-linux-musl]
rustflags = []

# Native macOS release targets must not inherit `target-cpu=native`; an artifact
# built on a newer Apple/Intel CPU still has to run on older machines of the
# same architecture.
[target.aarch64-apple-darwin]
rustflags = []

[target.x86_64-apple-darwin]
rustflags = []

[target.aarch64-pc-windows-msvc]
rustflags = []

[target.x86_64-pc-windows-msvc]
rustflags = []

# sqlite-vec 0.1.9 vendored C typedefs u_intN_t without including sys/types.h —
# glibc pulls it transitively, musl does not and also gates the aliases behind
# _BSD_SOURCE. cc-rs reads CFLAGS_<target> for C compile flags.
[env]
CFLAGS_x86_64_unknown_linux_musl = "-D_BSD_SOURCE -include sys/types.h"
CFLAGS_aarch64_unknown_linux_musl = "-D_BSD_SOURCE -include sys/types.h"

[target.'cfg(target_os = "linux")']
# mold is 2–5x faster than ld/lld for Rust workspaces. Install: `cargo install --git https://github.com/rui314/mold`.
# Uncomment after installing mold:
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.'cfg(target_os = "macos")']
# ld64.lld is the default linker on recent macOS toolchains and is usually fine.
# Uncomment for sccache-accelerated builds (install: `cargo install sccache`):
# rustc-wrapper = "sccache"

[net]
# Fetch all dependency git repos with the faster CLI fetcher.
git-fetch-with-cli = true

[registries.crates-io]
protocol = "sparse"   # 3x faster dependency resolution since 1.70
