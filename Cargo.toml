[workspace]
resolver = "2"
members = [
    "crates/synapse-core",
    "crates/synapse-cli",
    "crates/synapsed",
    "crates/synapse-mcp",
    "crates/synapse-learn",
    # scale-100M scaffolding (PR-0, empty stubs, TODO markers)
    "crates/synapse-ann",
    "crates/synapse-mysql",
    "crates/synapse-pg",
    "crates/synapse-embed-gpu",
    "crates/synapse-libsql",
    "crates/synapse-raft",
    "crates/synapse-tier",
    "crates/synapse-quant",
    "synapsestore/crates/synapse-wal",
    "synapsestore/crates/synapse-seg",
    "crates/synapse-engine",
    # Pingora HTTP frontend (benchmark: axum vs pingora)
    "crates/synapse-edge",
    "crates/synapse-license",
    # SOTA agent-memory layer (2026-04-29)
    "crates/synapse-rerank",
    "crates/synapse-extract",
    "crates/synapse-temporal",
    "crates/synapse-graph",
    # End-to-end LongMemEval benchmark runner (rule + optional MLX hooks)
    "bench/longmemeval",
    # Space concept hierarchy: Space → Wing → Room → Drawer
    "crates/synapse-space",
    # Criterion bench: synapse-space insert+query vs ChromaDB
    "bench/space-vs-chroma",
    # In-process ANN recall sweep (no HTTP overhead)
    "bench/industry",
    # High-throughput 4-tier vector search daemon (HNSW via usearch)
    "synapsestore/crates/synapse-ultra",
]

[workspace.package]
version = "1.0.1"
edition = "2021"
authors = ["Maxim Supersynergy <true@supersynergy.de>"]
license = "MIT"
repository = "https://github.com/Supersynergy/synapse"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
rusqlite = { version = "0.39", features = ["bundled", "blob", "backup", "functions"] }
sqlite-vec = "0.1"
zstd = "0.13"
blake3 = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
fastembed = { version = "5", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
# For Linux cross-compile, use: fastembed-dynamic = { package = "fastembed", version = "5", default-features = false, features = ["ort-load-dynamic", "hf-hub-rustls-tls"] }
# PINNED: redb 4.x has heavy schema breaking changes; revisit later.
redb = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.10"
# yrs bumped 0.21 → 0.26 (2026-05-06, no breaks). age 0.11 has Decryptor enum→struct break + SecretString Box<str> change — TODO migration in snap.rs:294-300.
age = { version = "0.10", features = ["armor"] }
yrs = "0.26"
linfa = "0.8"
linfa-clustering = "0.8"
# PINNED: ndarray 0.17 conflicts with linfa 0.8 (needs 0.16).
ndarray = "0.16.1"
fastbloom = "0.17"
toml = "1.1"
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }
argon2 = "0.5"
parking_lot = "0.12"
once_cell = "1"
statrs = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "blocking"] }

[profile.release-hardened]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
debug = false
incremental = false

# Speed-optimized profile: max inlining, fat LTO, abort. Slow build (~5min).
[profile.release-fast]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
debug = false
incremental = false

# Use this for production daemon binary: `cargo build --profile release-fast -p synapsed`
