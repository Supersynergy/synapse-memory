[package]
name = "synapse-mysql-async"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Async MySQL wire-protocol server for Synapse — opensrv-mysql + tokio. Phase 1 of MASTERPLAN-V2."

[[bin]]
name = "synapse-mysql-async"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite = { workspace = true, features = ["column_decltype"] }
sqlite-vec.workspace = true
synapse-core = { path = "../synapse-core" }
synapse-mysql = { path = "../synapse-mysql" }   # reuse rewrite + acl logic
opensrv-mysql = { git = "https://github.com/databendlabs/opensrv.git", tag = "v0.10.0", features = ["tls"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
rustls-pemfile = "2.0"
rustls-pki-types = "1.0"
mysql_common = "0.32"
chrono = "0.4"
regex = "1"
sha1 = "0.10"
blake3.workspace = true
lru = "0.12"
async-trait = "0.1"
parking_lot = "0.12"
