[advisories]
# RUSTSEC-2025-0119: number_prefix — transitive via indicatif → hf-hub → fastembed
# No upstream fix available; fastembed upgrade required when indicatif cuts a release.
# RUSTSEC-2024-0436: paste — transitive via tokenizers + rav1e → fastembed
# No direct fix path without swapping fastembed; accepted as low-severity.
# RUSTSEC-2024-0370: proc-macro-error — transitive via i18n-embed-fl → age
# age has not yet adopted proc-macro-error2; upstream tracking issue open.
ignore = [
    "RUSTSEC-2025-0119",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2024-0370",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "Zlib",
    "0BSD",
    "OpenSSL",
    "LGPL-2.1-or-later",
    "LGPL-3.0",
    "GPL-2.0-only",
    "NCSA",
]

[[licenses.exceptions]]
allow = ["MIT", "Apache-2.0", "NCSA"]
name = "libfuzzer-sys"

[[licenses.exceptions]]
allow = ["OpenSSL"]
name = "ring"

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
