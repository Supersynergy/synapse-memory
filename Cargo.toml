[patch.crates-io]
msql-srv = { path = "crates/msql-srv-patched" }

[workspace]
resolver = "2"
members = [
    "crates/synapse-core",
    "crates/synapse-cli",
    "crates/synapsed",
    "crates/synapse-mcp",
    "crates/synapse-learn",
    "crates/synapse-mysql",
    "crates/synapse-mysql-async",
    # scale-100M scaffolding (PR-0, empty stubs, TODO markers)
    "crates/synapse-ann",
    "crates/synapse-quant",
    "crates/synapse-wal",
    "crates/synapse-seg",
    "crates/synapse-lib-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Maxim Supersynergy <true@supersynergy.de>"]
license = "MIT"
repository = "https://github.com/Supersynergy/synapse"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
rusqlite = { version = "0.33", features = ["bundled", "blob", "backup", "functions"] }
sqlite-vec = "0.1"
zstd = "0.13"
blake3 = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
fastembed = "5"
redb = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
age = { version = "0.10", features = ["armor"] }
yrs = "0.21"
linfa = "0.8"
linfa-clustering = "0.8"
ndarray = "0.16.1"
fastbloom = "0.17"
toml = "0.8"
base64 = "0.22"
axum = "0.8"
argon2 = "0.5"
parking_lot = "0.12"
once_cell = "1"
statrs = "0.18"
reqwest = { version = "0.12", features = ["json", "blocking"] }
