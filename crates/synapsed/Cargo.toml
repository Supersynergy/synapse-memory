[package]
name = "synapsed"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "synapsed"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
rmp-serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
synapse-core = { path = "../synapse-core", features = ["embed", "turbo"] }
synapse-rerank = { path = "../synapse-rerank" }
synapse-license = { path = "../synapse-license", optional = true }
hex = { version = "0.4", optional = true }
dirs = { version = "6", optional = true }
ed25519-dalek.workspace = true
axum.workspace = true
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

[features]
default = ["embed-mlx"]
embed-mlx = ["synapse-core/embed-mlx"]
licensed = ["dep:synapse-license", "dep:hex", "dep:dirs", "synapse-core/encryption"]
