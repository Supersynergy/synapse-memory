[package]
name = "synapse-core"
version.workspace = true
edition.workspace = true
license = "FSL-1.1-ALv2"
authors.workspace = true
repository.workspace = true
description = "Single-file AI agent memory: SQLite+FTS5+sqlite-vec+fastembed, Ed25519-signed, CRDT-merge, hybrid BM25+vec RRF. Sub-ms library-mode."
keywords = ["memory", "vector", "embedding", "agent", "rag"]
categories = ["database", "data-structures"]
readme = "../../README.md"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
quick-xml = "0.41.0"
htmlescape = "0.3.1"
pdf-extract = { version = "0.12.0", optional = true }
rusqlite.workspace = true
sqlite-vec.workspace = true
tempfile = "3"
zstd.workspace = true
blake3.workspace = true
tracing.workspace = true
fastembed = { workspace = true, optional = true }
# embed-dynamic: ORT loaded via dlopen at runtime (no libstdc++ at link time).
# Required when cross-compiling from mac to linux without a Linux sysroot.
# Uses the same dep as `embed` but with ort-load-dynamic features layered on top.
# When --all-features is used, both embed and embed-dynamic activate dep:fastembed — no alias conflict.
redb = { workspace = true, optional = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
getrandom = "0.2"
age = { workspace = true, optional = true }
yrs = { workspace = true }
rmp-serde = { workspace = true }
linfa = { workspace = true, optional = true }
linfa-clustering = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
fastbloom = { workspace = true, optional = true }
toml.workspace = true
base64.workspace = true
bitflags = "2"
rayon = { version = "1", optional = true }
dashmap = { version = "6", optional = true }
parking_lot = { workspace = true, optional = true }
once_cell = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
# Turbo features
reqwest = { workspace = true, optional = true }
# M4 Max integration: NEON-native SIMD distances (f32/f16/i8/b8).
simsimd = { version = "6.5", optional = true }
# f16 storage/conversion helpers in turbo::f16_kernels (50% RAM savings).
half = { version = "2.7", optional = true }
# Schritt 1 optim #2: opt-in jemalloc for bench binary only (see bench-jemalloc feature).
tikv-jemallocator = { version = "0.6", optional = true }
# mlock / madvise / madvise wrappers in turbo::ram (unix only).
libc = { version = "0.2", optional = true }
# PR-A1-wire: pluggable ANN, default OFF per SPEC §3 (pure-Rust default).
synapse-ann = { path = "../synapse-ann", optional = true }
# NEON f16/i8 dot-product kernels (3.9× over scalar on M4 Max).
synapse-kernel = { path = "../synapse-kernel", optional = true }
synapse-engine = { path = "../synapse-engine", optional = true }
# RaBitQ 1-bit cascade index — proper Householder rotation from synapse-quant.
synapse-quant = { path = "../synapse-quant", features = ["rabitq"], optional = true }
async-trait = "0.1"
tokio = { workspace = true }
# SOTA agent-memory layer: NER gazetteer + temporal/regex extraction.
aho-corasick = "1"
regex = "1"
# embed-mlx feature: msgpack codec for the Python sidecar IPC.
rmpv = { version = "1", optional = true }
# tantivy-fts: route keyword search through synapse-fts (BM25 via tantivy).
# Default OFF — FTS5 path unchanged when this feature is absent.
synapse-fts = { path = "../synapse-fts", optional = true }
# HippoRAG-2 / GraphRAG graph-retrieval (PPR over KG). Default OFF.
synapse-graph = { path = "../synapse-graph", optional = true, features = ["hippo"] }
# SPANN disk-tier: in-memory centroids + mmap posting lists. Default OFF.
synapse-spann = { path = "../synapse-spann", optional = true }
# Production observability (OTel + Prometheus). Default OFF.
synapse-obs = { path = "../synapse-obs", optional = true }
# embed-metal: Candle + Metal backend for BGE-small on Apple Silicon.
# Feature-gated to avoid 200MB+ deps in default builds.
candle-core = { version = "0.9", optional = true, features = ["metal"] }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["http", "progressbar", "fancy-regex"] }
hf-hub = { version = "0.4", optional = true, features = ["tokio"] }
# Optional .synx helpers (off by default).
automerge = { version = "0.6", optional = true }
hex = { version = "0.4", optional = true }
tantivy = { version = "0.22", optional = true }
memmap2 = { version = "0.9", optional = true }
instant-distance = { version = "0.6", optional = true }

[dependencies.libsql]
version = "0.9"
optional = true
default-features = false
features = ["core"]

[features]
# 2026-05-10: simsimd enabled by default — 1.5× NEON cosine on M4 Max,
# AVX2 on x86_64. Apple Silicon + Linux aarch64 / x86_64 supported.
# Pure-Rust default lost; build with --no-default-features --features backend-rusqlite for pure-Rust.
default = [
    "backend-rusqlite",
    "turbo",
    "simsimd",
    "tantivy-fts",
    "sharding",
    "age-encryption",
    "pdf-ingest",
]
backend-rusqlite = []
backend-libsql = ["dep:libsql"]
embed = ["dep:fastembed", "dep:redb", "dep:parking_lot", "dep:once_cell", "dep:rayon"]
# embed-dynamic: ORT loaded via dlopen. Use for Linux cross-compile builds.
# At runtime, libonnxruntime.so must be on LD_LIBRARY_PATH or next to the binary.
embed-dynamic = ["dep:fastembed", "dep:redb", "dep:parking_lot", "dep:once_cell", "dep:rayon"]
encryption = ["dep:argon2", "rusqlite/bundled-sqlcipher-vendored-openssl"]
turbo = [
    "dep:dashmap",
    "dep:half",
    "dep:libc",
    "dep:ndarray",
    "dep:rayon",
    "dep:synapse-engine",
    "dep:synapse-kernel",
    "dep:synapse-quant",
]
sharding = [
    "dep:fastbloom",
    "dep:linfa",
    "dep:linfa-clustering",
    "dep:ndarray",
    "dep:rayon",
]
age-encryption = ["dep:age"]
pdf-ingest = ["dep:pdf-extract"]
ollama = ["turbo", "dep:reqwest"]
fresh-registry = ["dep:reqwest"]
# M4 Max NEON SIMD (f32/i8/b8). Apple Silicon + Linux aarch64 / x86_64 AVX2+.
simsimd = ["turbo", "dep:simsimd"]
# Apple Accelerate framework link (AMX + vDSP). macOS-only; auto via accelerate-src.
accelerate = []
# Schritt 1 optim #2: opt-in jemalloc for the scale-bench example only.
bench-jemalloc = ["dep:tikv-jemallocator"]
# mlock: pin hot vector pages in RAM (needs RLIMIT_MEMLOCK or CAP_IPC_LOCK). Unix only.
mlock = []
# huge-pages: MAP_HUGETLB 2 MB pages for SPANN posting-lists. Linux only.
huge-pages = []
# PR-A1-wire: enable usearch-backed Store::search_vec fast-path with
# sidecar persistence. Default OFF per SPEC §3 (pure-Rust default build).
ann-usearch = ["dep:synapse-ann", "synapse-ann/ann-usearch", "dep:parking_lot", "dep:instant-distance"]
# Phase 5 MLX Metal embedder (Apple Silicon only). IPC sidecar to mlx-embeddings.
# Implies `turbo` (needed for embedder_trait module).
embed-mlx = ["turbo", "dep:rmpv"]
# Phase 5b Candle-Metal: native Rust BERT on Metal GPU, no Python sidecar.
# Only builds on macOS aarch64. ~200MB deps (candle-transformers + tokenizers).
embed-metal = ["turbo", "dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub"]
# Route keyword/hybrid BM25 leg through tantivy instead of SQLite FTS5.
tantivy-fts = ["dep:synapse-fts", "dep:parking_lot"]
# Split-conformal recall prediction — statistical recall guarantee, default OFF.
conformal = []
# Production observability: OTel traces + Prometheus metrics on :9478/metrics.
observability = ["dep:synapse-obs", "synapse-obs/observability"]
# HippoRAG-2 / GraphRAG: graph-PPR retrieval layer, +20-30% recall on entity queries.
hippo = ["dep:synapse-graph"]
# Auto disk-tier via SPANN when corpus > SYNAPSE_RAM_THRESHOLD_DOCS (default 100_000).
spann-tier = ["dep:synapse-spann"]
# Optional .synx helper features.
automerge-crdt = ["dep:automerge", "dep:hex"]
synx-mmap = ["dep:memmap2"]
synx-sign = []
synx-tantivy = ["dep:tantivy"]
# Compatibility alias for older docs/patches.
vec-hnsw = ["ann-usearch"]
# Embedding dimension compile-time selection. Default = 384 (BGE-small / Arctic-XS/S).
# embed-768:  Arctic-M / Nomic-1.5  (MTEB ≤62.5)
# embed-1024: Mxbai-large / Arctic-L (MTEB ≤64.7)
embed-768 = []
embed-1024 = []

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
criterion = { version = "0.8", default-features = false }
parking_lot = "0.12"
# scale-bench example (PR-G2)
clap = { version = "4", features = ["derive"] }
sha2 = "0.11"

[[example]]
name = "libsql_fts5_abi_check"
path = "examples/libsql_fts5_abi_check.rs"
required-features = ["backend-libsql"]

[[example]]
name = "synapse_scale_bench"
path = "examples/synapse_scale_bench.rs"

[[example]]
name = "bench_progression"
path = "examples/bench_progression.rs"
required-features = ["turbo", "simsimd"]

[[example]]
name = "bench_embed_mlx"
path = "examples/bench_embed_mlx.rs"
required-features = ["embed-mlx", "embed"]

[[example]]
name = "bench_embed_metal"
path = "examples/bench_embed_metal.rs"
required-features = ["embed-metal"]

[[example]]
name = "bench_tiered"
path = "examples/bench_tiered.rs"
required-features = ["spann-tier", "simsimd"]

[lib]
doctest = false

[[bench]]
name = "fts"
harness = false

[[bench]]
name = "vec"
harness = false

[[bench]]
name = "kernels_progression"
harness = false
required-features = ["turbo", "simsimd"]

[[bench]]
name = "simsimd_vs_ndarray"
harness = false
required-features = ["turbo", "simsimd"]

[[bench]]
name = "rrf_simd"
harness = false

[[bench]]
name = "dist_score"
harness = false

[[bench]]
name = "rrf_neon"
harness = false

[[bench]]
name = "f16_hnsw"
harness = false
required-features = ["turbo"]

[[bench]]
name = "embed_cache"
harness = false
required-features = ["embed"]

[[bench]]
name = "adaptive_router_concurrent"
harness = false
required-features = ["turbo"]
