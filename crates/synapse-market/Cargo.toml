[package]
name = "synapse-market"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Embedded HFT/backtest engine on Synapse: OHLCV timeseries + regime-vec + news-FTS + graph-entity."
keywords = ["finance", "backtest", "timeseries", "trading", "hft"]
categories = ["database", "simulation"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
tracing.workspace = true
memmap2 = "0.9"
zstd = "0.13"
static_assertions = "1"
blake3 = "1"
lru = "0.12"
bincode = "1"
synapse-core = { path = "../synapse-core" }
wide = "0.7"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rabitq-rs = "0.9"
simsimd = "6"
turbovec = "0.2"
cranelift-codegen = { version = "0.131", default-features = false, features = ["x86", "arm64"] }
cranelift-frontend = "0.131"
cranelift-jit = "0.131"
cranelift-module = "0.131"
cranelift-native = "0.131"
xorf = "0.11"
fast_hilbert = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.27", features = ["native-tls"] }
futures-util = "0.3"
async-trait = "0.1"

[features]
default = []
polars = ["dep:polars-core", "dep:polars-io"]

[dependencies.polars-core]
version = "0.46"
optional = true
default-features = false

[dependencies.polars-io]
version = "0.46"
optional = true
default-features = false
features = ["csv", "parquet"]

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
accelerate-src = "0.3"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
rusqlite = { workspace = true }
duckdb = { version = "1", features = ["bundled"] }
accelerate-src = "0.3"
cblas-sys = "0.3"
proptest = "1"

[[bench]]
name = "bloom_neglookup"
path = "benches/bloom_neglookup.rs"
harness = false

[[bench]]
name = "bloom_bigscale"
path = "benches/bloom_bigscale.rs"
harness = false

[[bench]]
name = "scale_curve"
path = "benches/scale_curve.rs"
harness = false

[[bin]]
name = "gen_big_corpus"
path = "src/bin/gen_big_corpus.rs"

[[bin]]
name = "stream_smoke"
path = "src/bin/stream_smoke.rs"

[[bench]]
name = "amx_minimal"
path = "benches/amx_minimal.rs"
harness = false

[[bench]]
name = "amx_neon_mlx"
path = "benches/amx_neon_mlx.rs"
harness = false

[[bench]]
name = "xor_vs_bloom"
path = "benches/xor_vs_bloom.rs"
harness = false

[[bench]]
name = "w1_candle_range"
path = "benches/w1_candle_range.rs"
harness = false

[[bench]]
name = "w3_simd_agg"
path = "benches/w3_simd_agg.rs"
harness = false

[[bench]]
name = "w5_similarity"
path = "benches/w5_similarity.rs"
harness = false

[[bench]]
name = "turbovec_vs_rabitq"
path = "benches/turbovec_vs_rabitq.rs"
harness = false

[[bench]]
name = "router_mixed"
path = "benches/router_mixed.rs"
harness = false

[[bench]]
name = "book_replay"
path = "benches/book_replay.rs"
harness = false

[[bench]]
name = "api_correlation"
path = "benches/api_correlation.rs"
harness = false

[[bench]]
name = "hotset_point"
path = "benches/hotset_point.rs"
harness = false

[[bench]]
name = "jit_filter"
path = "benches/jit_filter.rs"
harness = false

[[bench]]
name = "compression_ratio"
path = "benches/compression_ratio.rs"
harness = false

[[example]]
name = "backtest_demo"
path = "examples/backtest_demo.rs"

[[bench]]
name = "online_learner"
path = "benches/online_learner.rs"
harness = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
