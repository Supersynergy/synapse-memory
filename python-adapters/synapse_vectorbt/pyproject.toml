[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synapse-vectorbt"
version = "0.1.0"
description = "Synapse-X adapter for vectorbt"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "synapse-market-py>=0.2; python_requires != 'stub'",
]

[project.optional-dependencies]
vectorbt = ["vectorbt>=0.27"]
dev = ["pytest>=8.0"]
