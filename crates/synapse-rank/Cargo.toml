[package]
name = "synapse-rank"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Enables LightGBM native bindings via lightgbm crate.
# Requires LightGBM shared library; falls back to python subprocess if disabled.
lightgbm-native = ["dep:lightgbm"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
synapse-learn = { path = "../synapse-learn", features = ["learn-to-rank"] }

# Optional: native LightGBM bindings
lightgbm = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "synapse-rank-train"
path = "src/main.rs"

[lib]
name = "synapse_rank"
path = "src/lib.rs"
doctest = false
