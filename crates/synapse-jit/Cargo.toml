[package]
name = "synapse-jit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Cranelift-JIT query compiler for Synapse — DuckDB-style hot-query speedup"

[features]
default = []
jit = ["dep:cranelift", "dep:cranelift-module", "dep:cranelift-jit", "dep:cranelift-frontend", "dep:cranelift-native"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
blake3.workspace = true

# JIT deps — only pulled when feature `jit` is enabled
cranelift           = { version = "0.131", optional = true }
cranelift-module    = { version = "0.131", optional = true }
cranelift-jit       = { version = "0.131", optional = true }
cranelift-frontend  = { version = "0.131", optional = true }
cranelift-native    = { version = "0.131", optional = true }

[[bench]]
name = "filter_bench"
harness = false

[dependencies.rusqlite]
version = "0.39"
features = ["bundled"]
optional = false

[dev-dependencies]
