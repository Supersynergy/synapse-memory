[package]
name = "synapse-ring"
version.workspace = true
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "HFT-pattern in-memory ring buffer with background snapshot. Billion-inserts/s relaxed-durability hot-path."

[lib]
name = "synapse_ring"

[dependencies]
