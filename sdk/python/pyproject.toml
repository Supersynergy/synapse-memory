[project]
name = "synapse-memory"
version = "0.1.0"
description = "Python SDK for Synapse — single-file AI agent memory with hybrid BM25+vec search, Ed25519 signing, CRDT merge"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Maxim Supersynergy", email = "true@supersynergy.de"}]
keywords = ["memory", "vector", "embedding", "agent", "rag", "synapse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
dependencies = ["msgpack>=1.0"]

[project.urls]
Homepage = "https://github.com/Supersynergy/synapse"
Repository = "https://github.com/Supersynergy/synapse"
Documentation = "https://github.com/Supersynergy/synapse/blob/main/docs/CLAUDE-CODE-MEMORY.md"

[project.scripts]
syn = "synapse_memory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synapse_memory"]
