[package]
name = "synapse-server"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "synapse-server — generic MySQL/PG drop-in daemon (synapsed sibling, minimal/CMS-focused)"

[[bin]]
name = "synapse-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
synapse-libsql = { path = "../synapse-libsql", features = ["libsql-backend"] }
synapse-mysql = { path = "../synapse-mysql" }
synapse-pg = { path = "../synapse-pg" }
synapse-ops = { path = "../synapse-ops" }
synapse-auth = { path = "../synapse-auth" }
synapse-tune = { path = "../synapse-tune" }

[features]
default = ["mysql-wire", "pg-wire", "ops"]
mysql-wire = []
pg-wire = []
ops = []
all = ["mysql-wire", "pg-wire", "ops"]
