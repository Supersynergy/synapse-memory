[advisories]
# RUSTSEC-2025-0119: number_prefix — transitive via indicatif → hf-hub → fastembed
# No upstream fix available; fastembed upgrade required when indicatif cuts a release.
# RUSTSEC-2024-0436: paste — transitive via tokenizers + rav1e → fastembed
# No direct fix path without swapping fastembed; accepted as low-severity.
# RUSTSEC-2024-0370: proc-macro-error — transitive via i18n-embed-fl → age
# age has not yet adopted proc-macro-error2; upstream tracking issue open.
ignore = [
    "RUSTSEC-2025-0119",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2024-0370",
    # Added 2026-05-10:
    # rsa 0.9.10 Marvin Attack — pulled by jsonwebtoken via synapse-license.
    # Reach: license-token verify only (HS512), not user crypto. Track: bump jsonwebtoken when rsa>=0.10 path lands.
    "RUSTSEC-2023-0071",
    # rustls-webpki 0.102.8 CRL bug — transitive duplicate; live rustls 0.23 already on 0.103.13.
    # Reach: Synapse doesn't fetch CRL distribution-points. Track: drop on next dep bump.
    "RUSTSEC-2025-0009",
    # bincode 1.3.3 unmaintained — migration to bincode 2.x scheduled 2026-Q3.
    "RUSTSEC-2025-0141",
    # chrono-english 0.1.8 unmaintained — replacement (dateparser/parse_datetime) eval in progress.
    "RUSTSEC-2024-0395",
    # instant 0.1.13 unmaintained — transitive via measure_time → tantivy → synapse-fts.
    # No safe upgrade: tantivy 0.22 depends on measure_time which depends on instant. Track tantivy upgrade.
    "RUSTSEC-2024-0384",
    # lru 0.12.5 and 0.13.0 IterMut unsound — transitive. No fix released yet (RUSTSEC-2026-0002).
    # Reach: internal LRU cache iteration. Not exposed in public API. Track: upgrade when lru fix lands.
    "RUSTSEC-2026-0002",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "Zlib",
    "0BSD",
    "OpenSSL",
    "LGPL-2.1-or-later",
    "LGPL-3.0",
    "GPL-2.0-only",
    "NCSA",
]

[[licenses.exceptions]]
allow = ["MIT", "Apache-2.0", "NCSA"]
name = "libfuzzer-sys"

[[licenses.exceptions]]
allow = ["OpenSSL"]
name = "ring"

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
