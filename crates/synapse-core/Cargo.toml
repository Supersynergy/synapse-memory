[package]
name = "synapse-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Single-file AI agent memory: SQLite+FTS5+sqlite-vec+fastembed, Ed25519-signed, CRDT-merge, hybrid BM25+vec RRF. Sub-ms library-mode."
keywords = ["memory", "vector", "embedding", "agent", "rag"]
categories = ["database", "data-structures"]
readme = "../../README.md"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
sqlite-vec.workspace = true
tempfile = "3"
zstd.workspace = true
blake3.workspace = true
tracing.workspace = true
fastembed = { workspace = true, optional = true }
redb = { workspace = true, optional = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
age = { workspace = true }
yrs = { workspace = true }
rmp-serde = { workspace = true }
linfa.workspace = true
linfa-clustering.workspace = true
ndarray.workspace = true
fastbloom.workspace = true
toml.workspace = true
base64.workspace = true
rayon = "1"
parking_lot = { workspace = true, optional = true }
once_cell = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
# Turbo features
reqwest = { workspace = true, optional = true }
# M4 Max integration: NEON-native SIMD distances (f32/f16/i8/b8).
simsimd = { version = "6.5", optional = true }
# Schritt 1 optim #2: opt-in jemalloc for bench binary only (see bench-jemalloc feature).
tikv-jemallocator = { version = "0.6", optional = true }
# PR-A1-wire: pluggable ANN, default OFF per SPEC §3 (pure-Rust default).
synapse-ann = { path = "../synapse-ann", optional = true }

[features]
default = []
embed = ["dep:fastembed", "dep:redb", "dep:parking_lot", "dep:once_cell"]
encryption = ["dep:argon2", "rusqlite/bundled-sqlcipher-vendored-openssl"]
turbo = []
ollama = ["turbo", "dep:reqwest"]
# M4 Max NEON SIMD (f32/i8/b8). Apple Silicon + Linux aarch64 / x86_64 AVX2+.
simsimd = ["turbo", "dep:simsimd"]
# Apple Accelerate framework link (AMX + vDSP). macOS-only; auto via accelerate-src.
accelerate = []
# Schritt 1 optim #2: opt-in jemalloc for the scale-bench example only.
bench-jemalloc = ["dep:tikv-jemallocator"]
# PR-A1-wire: enable usearch-backed Store::search_vec fast-path with
# sidecar persistence. Default OFF per SPEC §3 (pure-Rust default build).
ann-usearch = ["dep:synapse-ann", "synapse-ann/ann-usearch", "dep:parking_lot"]

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", default-features = false }
# scale-bench example (PR-G2)
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"

[[example]]
name = "synapse_scale_bench"
path = "examples/synapse_scale_bench.rs"

[[example]]
name = "bench_progression"
path = "examples/bench_progression.rs"
required-features = ["turbo", "simsimd"]

[lib]
doctest = false

[[bench]]
name = "fts"
harness = false

[[bench]]
name = "vec"
harness = false

[[bench]]
name = "kernels_progression"
harness = false
required-features = ["turbo", "simsimd"]
