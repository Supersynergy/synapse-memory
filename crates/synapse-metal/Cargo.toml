[workspace]
# Stand-alone workspace — see synapse-py for rationale (parent tree linters
# drop workspace.members entries).

[package]
name = "synapse-metal"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Maxim Supersynergy <true@supersynergy.de>"]
repository = "https://github.com/Supersynergy/synapse"
description = "Apple Silicon Metal compute shader backend for Synapse int8 MatVec (v0.1 scaffolding)."
keywords = ["metal", "apple-silicon", "simsimd", "vector-search", "synapse"]
categories = ["science", "algorithms"]

[dependencies]
thiserror = "1.0"
# Mature stable Rust→Metal wrapper. Used by wgpu, gfx-rs.
metal   = { version = "0.29", optional = true }
objc2   = { version = "0.5",  optional = true }

[features]
# Default is cpu-only fallback (portable); opt-in Metal on Apple Silicon.
default = []
gpu     = ["dep:metal", "dep:objc2"]

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
