# promptfoo eval config for synapse retrieval quality
# Run: promptfoo eval -c examples/promptfoo.yaml
# Docs: https://www.promptfoo.dev/docs/configuration/guide

description: "Synapse RAG retrieval quality benchmark"

providers:
  - id: "python:synapse_promptfoo.provider:call"
    config:
      sock_path: "/tmp/synapse.sock"
      mode: "Hybrid"
      limit: 5

prompts:
  - "What is {{topic}}?"
  - "Tell me about {{topic}}."
  - "Summarize key facts about {{topic}}."

tests:
  - vars:
      topic: "capital of France"
    assert:
      - type: contains
        value: "Paris"
      - type: javascript
        value: "output.length > 10"

  - vars:
      topic: "Python programming language"
    assert:
      - type: contains-any
        value: ["Python", "programming", "language"]

  - vars:
      topic: "machine learning fundamentals"
    assert:
      - type: javascript
        value: "output.split('\\n').length >= 1"

outputPath: "./results/synapse-eval-{{timestamp}}.json"

defaultTest:
  assert:
    - type: javascript
      value: "output !== 'No relevant context found.'"
      threshold: 0.8
