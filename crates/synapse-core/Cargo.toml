[package]
name = "synapse-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Single-file AI agent memory: SQLite+FTS5+sqlite-vec+fastembed, Ed25519-signed, CRDT-merge, hybrid BM25+vec RRF. Sub-ms library-mode."
keywords = ["memory", "vector", "embedding", "agent", "rag"]
categories = ["database", "data-structures"]
readme = "../../README.md"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
sqlite-vec.workspace = true
tempfile = "3"
zstd.workspace = true
blake3.workspace = true
tracing.workspace = true
fastembed = { workspace = true, optional = true }
redb = { workspace = true, optional = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
age = { workspace = true }
yrs = { workspace = true }
rmp-serde = { workspace = true }
linfa.workspace = true
linfa-clustering.workspace = true
ndarray.workspace = true
fastbloom.workspace = true
toml.workspace = true
base64.workspace = true
rayon = "1"
parking_lot = { workspace = true, optional = true }
once_cell = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
# Turbo features
reqwest = { workspace = true, optional = true }

[features]
default = []
embed = ["dep:fastembed", "dep:redb", "dep:parking_lot", "dep:once_cell"]
encryption = ["dep:argon2", "rusqlite/bundled-sqlcipher-vendored-openssl"]
turbo = []
ollama = ["turbo", "dep:reqwest"]

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", default-features = false }

[lib]
doctest = false

[[bench]]
name = "fts"
harness = false

[[bench]]
name = "vec"
harness = false
