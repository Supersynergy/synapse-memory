[package]
name = "longmemeval"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "LongMemEval-S benchmark runner for Synapse SOTA pipeline."

[[bin]]
name = "longmemeval"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
rusqlite.workspace = true
tokio = { workspace = true }
synapse-core = { path = "../../crates/synapse-core", features = ["embed"] }
synapse-extract = { path = "../../crates/synapse-extract" }

[features]
default = []
mlx = ["synapse-extract/mlx"]
