[package]
name = "synapse-olap"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "DuckDB-embedded OLAP engine with SQLite ATTACH — auto-routing OLTP↔OLAP"

[features]
default = []
olap = ["dep:duckdb"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true

[dependencies.duckdb]
version = "1"
features = ["bundled"]
optional = true


[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.39", features = ["bundled"] }
