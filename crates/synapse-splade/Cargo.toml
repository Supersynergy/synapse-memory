[package]
name = "synapse-splade"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SPLADE-v3 neural-sparse scaffold for Synapse — inverted-index BM25-style scoring"

[features]
default = []
# Enable when candle-core / ONNX model loader wired for real naver/splade-v3 inference
splade = []
# Real naver/splade-v3 via ONNX Runtime + HF tokenizer + hf-hub model download
splade-onnx = ["dep:ort", "dep:tokenizers", "dep:hf-hub"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
tracing.workspace = true

# SPLADE-v3 ONNX inference (feature-gated)
ort = { version = "2.0.0-rc.12", optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["onig"], optional = true }
hf-hub = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"

[lib]
name = "synapse_splade"
path = "src/lib.rs"
doctest = false

[[bench]]
name = "bmp_vs_naive"
path = "benches/bmp_vs_naive.rs"
harness = false
