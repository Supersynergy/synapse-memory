name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --workspace
      - name: Test core
        run: cargo test -p synapse-core --lib
      - name: Smoke bench (no-embed only, no model download)
        run: |
          rm -f /tmp/synapse_ci.sock /tmp/synapse_ci.db*
          ./target/release/synapsed -f /tmp/synapse_ci.db -s /tmp/synapse_ci.sock --lazy-embed &
          PID=$!
          sleep 0.5
          python3 -m pip install --break-system-packages msgpack
          python3 -c "
          import msgpack, socket, struct
          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.connect('/tmp/synapse_ci.sock')
          def call(r):
              b = msgpack.packb(r)
              s.sendall(struct.pack('<I', len(b)) + b)
              h = s.recv(4)
              n = struct.unpack('<I', h)[0]
              out = b''
              while len(out)<n: out += s.recv(n-len(out))
              return msgpack.unpackb(out, raw=False)
          assert call({'op':'Ping'}) == 'Pong' or 'Pong' in str(call({'op':'Ping'}))
          print('smoke ok')
          "
          kill $PID
