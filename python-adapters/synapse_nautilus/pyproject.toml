[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synapse-nautilus"
version = "0.1.0"
description = "Synapse-X DataClient for NautilusTrader"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
nautilus = ["nautilus-trader>=1.190"]
dev = ["pytest>=8.0"]
