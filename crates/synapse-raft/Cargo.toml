[package]
name = "synapse-raft"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Raft consensus for Synapse Store. Cluster-C of synapse-gap-sprint."

[dependencies]
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
serde = { version = "1", features = ["derive"] }
# openraft = { version = "0.9", optional = true }  # TODO cluster-C wiring

[features]
default = []
openraft-backend = []

[dev-dependencies]
serde_json = "1"
