[advisories]
# Transitive advisories pinned by deps we cannot upgrade; see
# release/synapse-agent-memory/audit.sh `allowed` list for pullers/reasons.
ignore = [
  "RUSTSEC-2024-0384", # instant — via tantivy/measure_time
  "RUSTSEC-2024-0436", # paste — via statrs/nalgebra
  "RUSTSEC-2026-0173", # proc-macro-error2 — via age
  "RUSTSEC-2026-0215", # smallstr — via yrs
]

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
