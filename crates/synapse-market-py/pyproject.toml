[build-system]
requires = ["maturin>=1.6,<2"]
build-backend = "maturin"

[project]
name = "synapse-market"
version = "0.1.0"
description = "Python bindings for synapse-market"
authors = [{ name = "Maxim Supersynergy", email = "true@supersynergy.de" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "synapse_market"
manifest-path = "Cargo.toml"
