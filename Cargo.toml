[workspace]
resolver = "2"
members = [
    "crates/synapse-kernel",
    "crates/synapse-core",
    "crates/synapse-cli",
    "crates/synapsed",
    "crates/synapse-mcp",
    "crates/synapse-learn",
    # scale-100M scaffolding (PR-0, ann core)
    "crates/synapse-ann",
    # SynapsQL — unified MySQL/PG-wire + Vector + FTS umbrella crate
    "crates/synapsql",
    # MySQL wire-protocol proxy → Synapse Store
    "crates/synapse-mysql",
    # Postgres wire-protocol proxy → Synapse Store
    "crates/synapse-pg",
    # synapse-embed-gpu = standalone workspace (fastembed feature conflict)
    "crates/synapse-libsql",
    "crates/synapse-raft",
    "crates/synapse-tier",
    "crates/synapse-quant",
    # Merged from synapsql 2026-05-09 — WP+ops+auth+tune
    "crates/synapse-cms",
    "crates/synapse-ops",
    "crates/synapse-auth",
    "crates/synapse-tune",
    "crates/synapse-server",
    # bench/wp pulls mysql 26 → lru 0.12.5 (RUSTSEC-2026-0002 unsound).
    # Excluded from default workspace; bench explicitly: `cargo bench -p synapse-cms-bench`.
    # "bench/wp",
    "synapsestore/crates/synapse-wal",
    "synapsestore/crates/synapse-seg",
    "crates/synapse-engine",
    # Pingora HTTP frontend (benchmark: axum vs pingora) — opt-in only.
    # NOTE: pingora-core 0.8.0 pulls daemonize/derivative (RUSTSEC unmaintained).
    # Excluded from default workspace until pingora ≥ 0.13 publishes patched deps.
    # Build explicitly: `cargo build -p synapse-edge` (developer opt-in).
    # "crates/synapse-edge",
    "crates/synapse-license",
    # SOTA agent-memory layer (2026-04-29)
    "crates/synapse-rerank",
    "crates/synapse-extract",
    "crates/synapse-temporal",
    "crates/synapse-graph",
    # End-to-end LongMemEval benchmark runner (rule + optional MLX hooks)
    "bench/longmemeval",
    # Space concept hierarchy: Space → Wing → Room → Drawer
    "crates/synapse-space",
    # Criterion bench: synapse-space insert+query vs ChromaDB
    "bench/space-vs-chroma",
    # In-process ANN recall sweep (no HTTP overhead)
    "bench/industry",
    # High-throughput 4-tier vector search daemon (HNSW via usearch)
    "synapsestore/crates/synapse-ultra", "crates/synapse-fts",
    # synapse-rank → experimental/ (6 LOC, 0 tests)
    # ColBERT-v2 multi-vector late-interaction scaffold
    "crates/synapse-colbert",
    # SPLADE-v3 neural-sparse inverted-index scaffold
    "crates/synapse-splade",
    # Multimodal CLIP-style image+text shared embedding space (feature-gated)
    # Default features=[] → no ort dep. Real CLIP: --features multimodal-dummy or multimodal
    "crates/synapse-multimodal",
    # Multi-node CRDT gossip cluster (AP, eventually consistent)
    "crates/synapse-cluster",
    # Production observability: OTel traces + Prometheus metrics
    "crates/synapse-obs",
    # Multimodal asset-DB + retrieval (images/video/audio, ComfyUI/Remotion/ffmpeg)
    "crates/synapse-media",
    # MUVERA RRF fusion: dense + ColBERT reciprocal-rank-fusion
    "crates/synapse-fusion",
    # Migration tool: import Qdrant/LanceDB/Chroma into .synx
    "crates/synapse-migrate",
    # Disk-tier SPANN: in-memory centroids + mmap posting-lists (unlimited corpus)
    "crates/synapse-spann",
    # JS/TS SDK via napi-rs — `bun add @supersynergy/synapse`
    "crates/synapse-js",
    # Embedded HFT/backtest engine: OHLCV + regime-vec + news-FTS + graph-entity
    "crates/synapse-market",
    # Distribution bindings: Python (pyo3/maturin), TS/Bun (FFI cdylib)
    "crates/synapse-market-py",
    "crates/synapse-market-ts",
    # DuckDB-embedded OLAP engine — feature-gated `olap` (duckdb bundled, heavy)
    "crates/synapse-olap",
    # MLX Metal GPU vectorized OLAP (candle-core Metal, feature-gated `mlx-olap`)
    "crates/synapse-mlx-olap",
    # CDC + continuous-query streaming layer
    "crates/synapse-stream",
    # GreptimeDB-pattern lite time-series columnar store (Arrow/Parquet, feature-gated)
    "crates/synapse-tsdb",
    # io_uring storage engine — Linux only, TigerBeetle-pattern (feature: io-uring)
    "crates/synapse-iouring",
    # Cranelift-JIT query compiler (feature-gated `jit`)
    "crates/synapse-jit",
]

[workspace.metadata]
# Production crates — included in default workspace build
production-members = [
    "synapse-kernel", "synapse-core", "synapse-cli", "synapsed", "synapse-mcp",
    "synapse-learn", "synapse-ann", "synapse-libsql", "synapse-raft", "synapse-tier",
    "synapse-quant", "synapse-cms", "synapse-ops", "synapse-auth", "synapse-tune",
    "synapse-server", "synapse-engine", "synapse-license", "synapse-rerank",
    "synapse-extract", "synapse-temporal", "synapse-graph", "synapse-space",
    "synapse-fts", "synapse-colbert", "synapse-splade", "synapse-multimodal",
    "synapse-cluster", "synapse-obs", "synapse-media", "synapse-fusion",
    "synapse-migrate", "synapse-spann", "synapse-js", "synapse-market",
    "synapse-wal", "synapse-seg", "synapse-ultra",
    "synapse-mysql", "synapse-pg", "synapsql",
]
# Experimental — moved to experimental/ (stubs, 0 tests, or standalone workspace)
# Build opt-in: `cd experimental && cargo build -p <name>`
experimental-members = [
    "synapse-edge", "synapse-rank", "synapse-embed-gpu",
]

[workspace.package]
version = "1.0.1-rc.1"
edition = "2021"
authors = ["Maxim Supersynergy <true@supersynergy.de>"]
license = "MIT"
repository = "https://github.com/Supersynergy/synapse"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
rusqlite = { version = "0.39", features = ["bundled", "blob", "backup", "functions"] }
sqlite-vec = "0.1"
zstd = "0.13"
blake3 = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
fastembed = { version = "5", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
# For Linux cross-compile, use: fastembed-dynamic = { package = "fastembed", version = "5", default-features = false, features = ["ort-load-dynamic", "hf-hub-rustls-tls"] }
# PINNED: redb 4.x has heavy schema breaking changes; revisit later.
redb = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.10"
# yrs bumped 0.21 → 0.26 (2026-05-06, no breaks). age 0.11 has Decryptor enum→struct break + SecretString Box<str> change — TODO migration in snap.rs:294-300.
age = { version = "0.10", features = ["armor"] }
yrs = "0.26"
linfa = "0.8"
linfa-clustering = "0.8"
# PINNED: ndarray 0.17 conflicts with linfa 0.8 (needs 0.16).
ndarray = "0.16.1"
fastbloom = "0.17"
toml = "1.1"
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }
argon2 = "0.5"
parking_lot = "0.12"
once_cell = "1"
statrs = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "blocking"] }

# 2026-05-10: default release now uses thin LTO + codegen-units=1.
# Adds ~30s build time, gains 5-15% perf across all benches (Mac+Linux).
# For dev iteration speed use `cargo build` (debug profile).
# For max-perf single-binary use `--profile release-fast` (fat LTO, ~5min build).
# For native-CPU max: `RUSTFLAGS="-C target-cpu=native" cargo build --profile release-native`
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
debug = false
incremental = false

# Native-CPU profile: inherit release + RUSTFLAGS="-C target-cpu=native" for AVX2/NEON tuning.
# Usage: RUSTFLAGS="-C target-cpu=native" cargo build --profile release-native -p synapsed
[profile.release-native]
inherits = "release"

[profile.release-hardened]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
debug = false
incremental = false

# Speed-optimized profile: max inlining, fat LTO, abort. Slow build (~5min).
[profile.release-fast]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
debug = false
incremental = false

# Use this for production daemon binary: `cargo build --profile release-fast -p synapsed`

# ANN bench profile: native CPU + fat LTO + native-tuned.
# Usage: RUSTFLAGS="-C target-cpu=native" cargo bench --profile release-bench -p synapse-ann
[profile.release-bench]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "none"
debug = true
overflow-checks = false
